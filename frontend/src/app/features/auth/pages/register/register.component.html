<div class="auth-layout">
  <!-- Left Side - Image -->
  <div class="auth-layout__image">
    <div class="auth-layout__image-overlay">
      <img 
        src="assets/images/floresconchocolat.jpg" 
        alt="Velvet & Vine - Regalos elegantes"
        class="auth-layout__image-bg"
      />
    </div>
  </div>

  <!-- Right Side - Form -->
  <div class="auth-layout__content">
    <div class="auth-card">
      <!-- Logo and Welcome -->
      <div class="auth-card__header">
        <h1 class="auth-card__logo">
          Velvet <span class="auth-card__logo-accent">&</span> Vine
        </h1>
        <p class="auth-card__subtitle">
          Join our world of curated elegance and thoughtful gifting.
        </p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <a routerLink="/auth/login" class="auth-tabs__tab">
          LOGIN
        </a>
        <button class="auth-tabs__tab auth-tabs__tab--active">
          CREATE ACCOUNT
        </button>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage()" class="alert alert--error" role="alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        {{ errorMessage() }}
      </div>

      <!-- Register Form -->
      <form class="auth-form" (submit)="onSubmit($event)">
        <!-- Name Fields Row -->
        <div class="form-row form-row--2-cols">
          <div class="form-field">
            <label for="firstName" class="form-field__label">
              First Name
            </label>
            <input
              id="firstName"
              type="text"
              class="form-field__input"
              placeholder="John"
              [value]="formData().firstName"
              (input)="onFirstNameChange($any($event.target).value)"
              [disabled]="isLoading()"
              autocomplete="given-name"
              required
            />
          </div>

          <div class="form-field">
            <label for="lastName" class="form-field__label">
              Last Name
            </label>
            <input
              id="lastName"
              type="text"
              class="form-field__input"
              placeholder="Doe"
              [value]="formData().lastName"
              (input)="onLastNameChange($any($event.target).value)"
              [disabled]="isLoading()"
              autocomplete="family-name"
              required
            />
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-field">
          <label for="email" class="form-field__label">
            Email Address
          </label>
          <div class="form-field__input-wrapper">
            <svg class="form-field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m2 7 10 7 10-7"></path>
            </svg>
            <input
              id="email"
              type="email"
              class="form-field__input"
              placeholder="hello@example.com"
              [value]="formData().email"
              (input)="onEmailChange($any($event.target).value)"
              [disabled]="isLoading()"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-field">
          <label for="password" class="form-field__label">
            Password
          </label>
          <div class="form-field__input-wrapper">
            <svg class="form-field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              class="form-field__input"
              placeholder="••••••••"
              [value]="formData().password"
              (input)="onPasswordChange($any($event.target).value)"
              [disabled]="isLoading()"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="form-field__toggle"
              (click)="togglePasswordVisibility()"
              [disabled]="isLoading()"
              aria-label="Toggle password visibility"
            >
              <svg *ngIf="!showPassword()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          
          <!-- Password Strength Indicator -->
          <div *ngIf="passwordStrength()" class="password-strength">
            <div class="password-strength__bars">
              <div 
                class="password-strength__bar"
                [class.password-strength__bar--active]="passwordStrength() === 'weak' || passwordStrength() === 'medium' || passwordStrength() === 'strong'"
                [class.password-strength__bar--weak]="passwordStrength() === 'weak'"
                [class.password-strength__bar--medium]="passwordStrength() === 'medium' || passwordStrength() === 'strong'"
                [class.password-strength__bar--strong]="passwordStrength() === 'strong'"
              ></div>
              <div 
                class="password-strength__bar"
                [class.password-strength__bar--active]="passwordStrength() === 'medium' || passwordStrength() === 'strong'"
                [class.password-strength__bar--medium]="passwordStrength() === 'medium' || passwordStrength() === 'strong'"
                [class.password-strength__bar--strong]="passwordStrength() === 'strong'"
              ></div>
              <div 
                class="password-strength__bar"
                [class.password-strength__bar--active]="passwordStrength() === 'strong'"
                [class.password-strength__bar--strong]="passwordStrength() === 'strong'"
              ></div>
            </div>
            <span class="password-strength__text" [class]="'password-strength__text--' + passwordStrength()">
              {{ passwordStrength() === 'weak' ? 'Weak' : passwordStrength() === 'medium' ? 'Medium' : 'Strong' }}
            </span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-field">
          <label for="confirmPassword" class="form-field__label">
            Confirm Password
          </label>
          <div class="form-field__input-wrapper">
            <svg class="form-field__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="confirmPassword"
              [type]="showConfirmPassword() ? 'text' : 'password'"
              class="form-field__input"
              placeholder="••••••••"
              [value]="formData().confirmPassword"
              (input)="onConfirmPasswordChange($any($event.target).value)"
              [disabled]="isLoading()"
              autocomplete="new-password"
              required
            />
            <button
              type="button"
              class="form-field__toggle"
              (click)="toggleConfirmPasswordVisibility()"
              [disabled]="isLoading()"
              aria-label="Toggle confirm password visibility"
            >
              <svg *ngIf="!showConfirmPassword()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showConfirmPassword()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Terms and Conditions -->
        <div class="form-field">
          <label class="form-checkbox-label">
            <input
              type="checkbox"
              class="form-checkbox"
              [checked]="formData().acceptTerms"
              (change)="onAcceptTermsChange($any($event.target).checked)"
              [disabled]="isLoading()"
              required
            />
            <span>
              I agree to the 
              <a routerLink="/terms" class="form-link">Terms of Service</a> 
              and 
              <a routerLink="/privacy" class="form-link">Privacy Policy</a>
            </span>
          </label>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn--primary btn--block btn--lg"
          [disabled]="isLoading()"
        >
          <span *ngIf="!isLoading()">CREATE ACCOUNT</span>
          <span *ngIf="isLoading()" class="btn__spinner">
            <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            Creating account...
          </span>
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider">
        <span class="auth-divider__text">OR SIGN UP WITH</span>
      </div>

      <!-- Social Login -->
      <div class="social-login">
        <button
          type="button"
          class="btn btn--social"
          (click)="onGoogleRegister()"
          [disabled]="isLoading()"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>

        <button
          type="button"
          class="btn btn--social"
          (click)="onFacebookRegister()"
          [disabled]="isLoading()"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Facebook
        </button>
      </div>

      <!-- Already have account -->
      <div class="auth-card__footer">
        Already have an account?
        <a routerLink="/auth/login" class="form-link">Sign in</a>
      </div>
    </div>
  </div>
</div>
