<!-- ============================================ -->
<!-- HERO BANNER - Colección Edición Limitada -->
<!-- ============================================ -->
<section class="hero">
  <div class="hero__container">
    <!-- Contenido de texto -->
    <div class="hero__content">
      <span class="hero__label">COLECCIÓN EDICIÓN LIMITADA</span>
      
      <h1 class="hero__title">
        Regalos Perfectos para <span class="hero__title--accent">Días Especiales</span>
      </h1>
      
      <p class="hero__description">
        Descubre la intersección de alegría y lujo con nuestros ramos curados a mano, 
        chocolates artesanales y sets de regalo emotivos.
      </p>
      
      <div class="hero__actions">
        <button class="btn-primary" (click)="onShopBoutique()">
          Ver Toda la Tienda
        </button>
        <button class="btn-outline" (click)="onExploreRegistry()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
          Explorar Registro
        </button>
      </div>
    </div>
    
    <!-- Imagen del héroe -->
    <div class="hero__image">
      <img 
        src="https://images.unsplash.com/photo-1606800052052-452d5c61c4b7?w=800&h=600&fit=crop" 
        alt="Ramo de flores premium con chocolates artesanales"
        class="hero__img"
      />
    </div>
  </div>
</section>
