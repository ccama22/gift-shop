<!-- 🎁 Velvet & Vine Tienda de Regalos -->

<!-- ============================================ -->
<!-- ENCABEZADO / NAVEGACIÓN - Solo para ventana principal -->
<!-- ============================================ -->
<header *ngIf="!isAuthRoute && !isAdminRoute" class="header">
  <div class="header__container">
    <!-- Logo -->
    <div class="header__logo">
      <h1 style="margin: 0; font-family: 'Playfair Display', serif; font-size: 1.25rem; color: #b02545;">
        Velvet <span style="font-style: italic;">&</span> Vine
      </h1>
    </div>

    <!-- Navegación Desktop -->
    <nav class="header__nav">
      <a 
        *ngFor="let item of menuItems" 
        class="header__nav-link"
        [class.header__nav-link--active]="item === 'Inicio'"
        href="javascript:void(0)">
        {{ item }}
      </a>
    </nav>

    <!-- Acciones (Login/Register o Perfil de Usuario Logueado) -->
    <div class="header__actions">
      <ng-container *ngIf="isAuthenticated(); else unauthenticatedTpl">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <!-- Botón ir a Admin (si es Admin) -->
          <a *ngIf="isAdmin()" routerLink="/admin/inventory" class="btn-outline" style="padding: 0.4rem 0.85rem; font-size: 0.75rem; border-radius: 0.5rem; text-decoration: none; display: flex; align-items: center; gap: 0.35rem;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            Panel Admin
          </a>

          <!-- Perfil con Avatar -->
          <div style="display: flex; align-items: center; gap: 0.5rem; background: #FFF5F7; padding: 0.25rem 0.75rem 0.25rem 0.25rem; border-radius: 2rem; border: 1px solid #FFE8EC;">
            <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #D63447 0%, #B02545 100%); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; font-family: 'Montserrat', sans-serif;">
              {{ userInitials }}
            </div>
            <div style="display: flex; flex-direction: column; text-align: left;">
              <span style="font-size: 0.8rem; font-weight: 600; color: #1A1A1A; line-height: 1.1; font-family: 'Montserrat', sans-serif;">{{ userName }}</span>
              <span style="font-size: 0.625rem; color: #D63447; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-family: 'Montserrat', sans-serif;">{{ currentUser()?.role }}</span>
            </div>
          </div>

          <!-- Botón Logout -->
          <button (click)="onLogout()" title="Cerrar Sesión" style="background: white; border: 1px solid #EEDDD9; border-radius: 0.5rem; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #887271; transition: all 0.2s;" onmouseover="this.style.color='#D63447'; this.style.borderColor='#D63447'" onmouseout="this.style.color='#887271'; this.style.borderColor='#EEDDD9'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </ng-container>

      <ng-template #unauthenticatedTpl>
        <!-- Botón Login -->
        <button class="btn-link header__auth-btn" (click)="onLogin()">
          Login
        </button>

        <!-- Botón Register -->
        <button class="btn-primary header__auth-btn" (click)="onRegister()">
          Register
        </button>
      </ng-template>

      <!-- Menú Móvil -->
      <button class="header__icon-btn header__menu-toggle" aria-label="Menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- ============================================ -->
<!-- ROUTER OUTLET - Aquí se cargan las páginas -->
<!-- ============================================ -->
<router-outlet />
